name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data-pipeline:
    name: Validate data pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desafios/analise-credito/requirements.txt

      - name: Install dependencies
        working-directory: desafios/analise-credito
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run data treatment
        working-directory: desafios/analise-credito
        run: python tratamento_dados.py
